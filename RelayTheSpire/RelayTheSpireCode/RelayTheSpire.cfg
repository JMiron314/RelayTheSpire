# RelayTheSpire Configuration
# Place this file in the same folder as RelayTheSpire.dll
# Lines starting with # are comments and are ignored.
#
# SETUP INSTRUCTIONS:
#   1. Create a GitHub repository to store relay runs (e.g. "sts2-relay")
#   2. Generate a GitHub Personal Access Token:
#      - Go to github.com/settings/tokens
#      - Click "Generate new token (classic)"
#      - Check the "repo" scope
#      - Copy the token (starts with ghp_)
#   3. Fill in the three required fields below and save this file.
#   4. Launch Slay the Spire 2 — the mod will load automatically.

# Required: your GitHub username or organization name
github_owner = 

# Required: the name of your relay repository
github_repo = 

# Required: your GitHub Personal Access Token (keep this private!)
github_token = 

# Optional: which branch to use (default: main)
# github_branch = main

# Optional: after a successful push, send the player back to the main menu
# since it's no longer their turn (default: true). Set to false to keep playing while testing.
# exit_to_menu_after_push = true

# Optional: when a player may take another turn in a run they've already played.
#   once  = never (each player plays a run at most once)
#   N     = a player is blocked only while they're in the last N turns of the run
#           (2 = at least 2 other turns must be played before they can return)
# Default: 2
# repeat_policy = 2

# Optional: how many floors a player plays before the baton is passed (default: 1).
# The turn ends, and the run is pushed, when the player picks the map node that
# completes this many floors. Must be 1 or more.
# floors_per_turn = 1